<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Personal WBS icon: a round little octopus clerk hugging the one ledger it fills from chats and mail -->
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.4" r="0.78"><stop offset="0" stop-color="#F4FCF8"/><stop offset="1" stop-color="#C9EEE4"/></radialGradient>
    <radialGradient id="body" cx="0.38" cy="0.3" r="0.85"><stop offset="0" stop-color="#FFB7C5"/><stop offset="1" stop-color="#FF8DA4"/></radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- little things it gathered, floating in -->
  <g transform="rotate(-10 190 250)">
    <path d="M118 196 h150 a28 28 0 0 1 28 28 v60 a28 28 0 0 1 -28 28 h-92 l-40 32 l6 -32 h-24 a28 28 0 0 1 -28 -28 v-60 a28 28 0 0 1 28 -28 z" fill="#FFFFFF" stroke="#BFE3D7" stroke-width="8" stroke-linejoin="round"/>
    <circle cx="156" cy="254" r="13" fill="#9B86E3"/><circle cx="194" cy="254" r="13" fill="#9B86E3"/><circle cx="232" cy="254" r="13" fill="#9B86E3"/>
  </g>
  <g transform="rotate(9 838 250)">
    <rect x="760" y="196" width="160" height="112" rx="18" fill="#FFFFFF" stroke="#BFE3D7" stroke-width="8"/>
    <path d="M774 212 L840 262 L906 212" fill="none" stroke="#FF7F98" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M896 404 l11 28 l28 11 l-28 11 l-11 28 l-11 -28 l-28 -11 l28 -11 z" fill="#FFC94A"/>
  <path d="M128 452 l8 20 l20 8 l-20 8 l-8 20 l-8 -20 l-20 -8 l20 -8 z" fill="#FFC94A"/>
  <!-- stubby legs -->
  <g fill="none" stroke="#FF94AA" stroke-width="76" stroke-linecap="round">
    <path d="M318 640 C 280 700, 238 722, 200 712"/>
    <path d="M386 680 C 366 748, 330 790, 290 800"/>
    <path d="M706 640 C 744 700, 786 722, 824 712"/>
    <path d="M638 680 C 658 748, 694 790, 734 800"/>
  </g>
  <g fill="#FFD0DA"><circle cx="236" cy="704" r="10"/><circle cx="276" cy="690" r="9"/><circle cx="318" cy="784" r="10"/><circle cx="350" cy="760" r="9"/><circle cx="788" cy="704" r="10"/><circle cx="748" cy="690" r="9"/><circle cx="706" cy="784" r="10"/><circle cx="674" cy="760" r="9"/></g>
  <g fill="none" stroke="#FF94AA" stroke-width="70" stroke-linecap="round"><path d="M336 640 C 326 700, 334 744, 352 772"/><path d="M688 640 C 698 700, 690 744, 672 772"/></g>
  <!-- round mochi head -->
  <path d="M214 492 C 214 300, 346 186, 512 186 C 678 186, 810 300, 810 492 C 810 640, 694 724, 512 724 C 330 724, 214 640, 214 492 Z" fill="url(#body)"/>
  <ellipse cx="364" cy="300" rx="62" ry="34" transform="rotate(-24 364 300)" fill="#FFFFFF" opacity="0.55"/>
  <circle cx="440" cy="250" r="13" fill="#FFFFFF" opacity="0.55"/>
  <circle cx="664" cy="292" r="19" fill="#FFC6D2"/><circle cx="716" cy="352" r="11" fill="#FFC6D2"/><circle cx="618" cy="244" r="10" fill="#FFC6D2"/>
  <!-- big shiny eyes, low on the face -->
  <ellipse cx="418" cy="500" rx="52" ry="60" fill="#3A2E4F"/><ellipse cx="606" cy="500" rx="52" ry="60" fill="#3A2E4F"/>
  <circle cx="436" cy="476" r="21" fill="#FFFFFF"/><circle cx="624" cy="476" r="21" fill="#FFFFFF"/>
  <circle cx="400" cy="528" r="9" fill="#FFFFFF"/><circle cx="588" cy="528" r="9" fill="#FFFFFF"/>
  <ellipse cx="336" cy="590" rx="44" ry="24" fill="#FF6F91" opacity="0.45"/><ellipse cx="688" cy="590" rx="44" ry="24" fill="#FF6F91" opacity="0.45"/>
  <!-- small open smile -->
  <path d="M484 566 Q 512 606 540 566 Z" fill="#5A2E46" stroke="#5A2E46" stroke-width="8" stroke-linejoin="round"/>
  <ellipse cx="512" cy="588" rx="12" ry="7" fill="#FF7A93"/>
  <!-- the ledger it hugs -->
  <g>
    <path d="M512 742 C 462 722, 404 718, 344 728 v126 c 60 -10, 118 -6, 168 14 z" fill="#FFF6DD" stroke="#E8C57C" stroke-width="9" stroke-linejoin="round"/>
    <path d="M512 742 C 562 722, 620 718, 680 728 v126 c -60 -10, -118 -6, -168 14 z" fill="#FFF6DD" stroke="#E8C57C" stroke-width="9" stroke-linejoin="round"/>
    <rect x="372" y="760" width="110" height="13" rx="6.5" fill="#5CC48F"/><rect x="372" y="790" width="84" height="13" rx="6.5" fill="#FFC23D"/><rect x="372" y="820" width="102" height="13" rx="6.5" fill="#8CC2FF"/>
    <rect x="542" y="760" width="104" height="13" rx="6.5" fill="#B49CEB"/>
    <path d="M548 800 l16 16 l32 -34" fill="none" stroke="#3DBE84" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- arms around the book, one holding a pencil -->
  <g transform="rotate(28 700 760)">
    <rect x="684" y="664" width="32" height="104" rx="6" fill="#FFC23D"/><rect x="684" y="664" width="32" height="20" rx="6" fill="#FF94AA"/>
    <path d="M684 768 h32 l-16 32 z" fill="#F6D7A7"/><path d="M694 788 h12 l-6 12 z" fill="#3A2E4F"/>
  </g>
  <circle cx="352" cy="776" r="30" fill="#FF94AA"/><circle cx="672" cy="776" r="30" fill="#FF94AA"/>
</svg>
